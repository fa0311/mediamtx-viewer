events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  upstream webrtc { server mediamtx:8889; }
  upstream hls { server mediamtx:8888; }

  server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite emits hashed filenames, so they can be cached forever.
    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WHIP (publish) and WHEP (play) for /<stream>/whip and /<stream>/whep.
    location ~ ^/[^/]+/(whip|whep)(/|$) {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://webrtc;
    }

    # Low-latency HLS playlists and segments for /<stream>/*.m3u8 etc.
    location ~ ^/[^/]+/[^/]+\.(m3u8|mp4|m4s|ts)$ {
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://hls;
    }

    # /<stream> is a client-side route; everything else is a static file.
    location / {
      add_header Cache-Control "no-store";
      try_files $uri /index.html;
    }
  }
}
